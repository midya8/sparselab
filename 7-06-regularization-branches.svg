<text x="48" y="967" font-size="18" fill="#251f21" font-weight="600" >Feature 1 leaves at lambda = 1 and re-enters negative at lambda = 1/3.</text>
<text x="48" y="1000" font-size="17" fill="#585254" font-weight="400" >Singular selected Gram: explicit noncertificate. Boundary zeros are allowed, not called active.</text>
