name: SparseLab checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: |
          python -m sparselab demo > /tmp/demo.json
          cmp /tmp/demo.json examples/demo.json
          python -m sparselab path examples/input.json > /tmp/input.json
          python examples/render_figure.py --check
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip wheel --no-deps . -w /tmp/wheels
      - run: |
          python -m sparselab demo > /tmp/source-demo.json
          python -m sparselab path examples/input.json > /tmp/source-input.json
          python -m pip install --no-deps --target /tmp/installed /tmp/wheels/*.whl
          cd /tmp
          PYTHONPATH=/tmp/installed python -m sparselab demo > /tmp/wheel-demo.json
          PYTHONPATH=/tmp/installed python -m sparselab path "$GITHUB_WORKSPACE/examples/input.json" > /tmp/wheel-input.json
          cmp /tmp/source-demo.json /tmp/wheel-demo.json
          cmp /tmp/source-input.json /tmp/wheel-input.json
